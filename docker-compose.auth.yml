services:
  nexawise_postgres:
    image: postgres:16-alpine
    container_name: nexawise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexawise
      POSTGRES_USER: nexawise
      POSTGRES_PASSWORD: nexawise_dev_password
    ports:
      - "5434:5432"
    volumes:
      - nexawise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexawise -d nexawise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexawise_postgres_data:
